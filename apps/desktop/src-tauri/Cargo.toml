[package]
name = "aurora-launcher-core"
version = "0.1.1-alpha.3"
edition = "2021"
description = "Aurora Smart Launcher - Module A engine"
license = "GPL-3.0-only"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tauri = { version = "2.11.1", features = [] }
tauri-plugin-global-shortcut = "2.3.2"
uuid = { version = "1", features = ["serde", "v3", "v4"] }
tungstenite = "0.24"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
sha1 = "0.10"
sha2 = "0.10"
zip = "2"
base64 = "0.22"
edge-tts-rust = "0.1.3"
ed25519-dalek = "2"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
