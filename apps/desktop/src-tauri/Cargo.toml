[package]
name = "aurora-launcher-core"
version = "0.1.1-alpha.14"
edition = "2021"
description = "Aurora Smart Launcher - Module A engine"
license = "GPL-3.0-only"

[features]
connect-lab = ["dep:aurora-connect-lab", "dep:tokio", "dep:tokio-util"]
connect-voice-lab = ["dep:toml"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tauri = { version = "2.11.1", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2.3.2"
uuid = { version = "1", features = ["serde", "v3", "v4"] }
tungstenite = "0.24"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
sha1 = "0.10"
sha2 = "0.10"
zip = "2"
base64 = "0.22"
edge-tts-rust = "0.1.3"
ed25519-dalek = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
fs2 = "0.4"
toml = { version = "=0.9.12", optional = true, default-features = false, features = ["parse", "serde", "std"] }
aurora-connect-lab = { path = "../../connect-lab", optional = true }
tokio = { version = "1", optional = true, features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
tokio-util = { version = "0.7", optional = true, features = ["rt"] }

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
