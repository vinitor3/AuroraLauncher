plugins {
    id "architectury-plugin" version "3.4-SNAPSHOT"
    id "dev.architectury.loom" version "1.3.385" apply false
    id "com.github.johnrengelman.shadow" version "7.1.2" apply false
}

architectury {
    minecraft = rootProject.minecraft_version
}

subprojects {
    apply plugin: "dev.architectury.loom"
    loom { silentMojangMappingsLicense() }
    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
        mappings loom.officialMojangMappings()
    }
}

allprojects {
    apply plugin: "java"
    apply plugin: "architectury-plugin"
    apply plugin: "maven-publish"

    version = rootProject.mod_version
    group = rootProject.maven_group
    base { archivesName = rootProject.archives_base_name }
    def requestedJavaVersion = Integer.parseInt(rootProject.compile_java_version)
    java { toolchain { languageVersion = JavaLanguageVersion.of(Math.max(17, requestedJavaVersion)) } }
    tasks.withType(JavaCompile).configureEach {
        options.encoding = "UTF-8"
        options.release = requestedJavaVersion
    }
}
