plugins { id "com.github.johnrengelman.shadow" }
architectury { platformSetupLoomIde(); fabric() }

configurations { common; shadowCommon; compileClasspath.extendsFrom common; runtimeClasspath.extendsFrom common }

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionFabric")) { transitive false }
    shadowCommon "org.java-websocket:Java-WebSocket:1.5.6"
}

processResources {
    inputs.properties "version": project.version, "minecraft_version": rootProject.minecraft_version, "java_version": rootProject.java_version, "fabric_minecraft_range": rootProject.fabric_minecraft_range
    filesMatching("fabric.mod.json") {
        expand "version": project.version, "minecraft_version": rootProject.minecraft_version, "java_version": rootProject.java_version, "fabric_minecraft_range": rootProject.fabric_minecraft_range
    }
}
shadowJar {
    configurations = [project.configurations.shadowCommon]
    archiveClassifier = "dev-shadow"
    manifest { attributes "MixinConfigs": "aurora_companion.mixins.json" }
}
remapJar { input.set shadowJar.archiveFile; dependsOn shadowJar }
