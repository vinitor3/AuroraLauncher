plugins {
    id "java"
    id "com.gradleup.shadow" version "8.3.6"
}

group = "com.aurora"
version = "0.1.0"

repositories {
    mavenCentral()
    maven { url "https://maven.minecraftforge.net/" }
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(17) }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 8
}

dependencies {
    // A API é fornecida pelo Forge dentro do jogo; ela não entra no JAR final.
    compileOnly "net.minecraftforge:forge:1.12.2-14.23.5.2860:universal"
    implementation "org.java-websocket:Java-WebSocket:1.5.6"
    implementation "org.slf4j:slf4j-api:1.7.36"
    implementation "org.slf4j:slf4j-nop:1.7.36"
}

sourceSets.main.java.srcDir "../../shared-ui/src/main/java"
sourceSets.main.java.srcDir "../../profile-appearance/src/main/java"

jar { archiveClassifier = "thin" }

shadowJar {
    archiveBaseName = "aurora-companion-forge-1.12.2"
    archiveClassifier = ""
    archiveVersion = project.version
    configurations = [project.configurations.runtimeClasspath]
    // O LaunchClassLoader do Forge 1.12.2 reserva alguns namespaces de
    // logging. Manter as dependencias em um namespace privado evita que o
    // SLF4J empacotado seja ocultado e também previne conflitos com mods.
    relocate "org.java_websocket", "com.aurora.shadow.java_websocket"
    relocate "org.slf4j", "com.aurora.shadow.slf4j"
    exclude "META-INF/versions/**"
    exclude "module-info.class"
}

tasks.build.dependsOn tasks.shadowJar
