plugins {
    id "architectury-plugin" version "3.4-SNAPSHOT"
    id "dev.architectury.loom" version "1.3.385" apply false
    id "com.github.johnrengelman.shadow" version "7.1.2" apply false
}

apply from: rootProject.file("../../../../scripts/aurora-mod-versions.gradle")

architectury { minecraft = rootProject.minecraft_version }

subprojects {
    apply plugin: "dev.architectury.loom"
    loom { silentMojangMappingsLicense() }
    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
        mappings loom.officialMojangMappings()
    }
}

allprojects {
    apply plugin: "java"
    apply plugin: "architectury-plugin"
    version = rootProject.auroraVersions.core
    group = rootProject.maven_group
    base { archivesName = rootProject.archives_base_name }
    java { toolchain { languageVersion = JavaLanguageVersion.of(17) } }
    tasks.withType(JavaCompile).configureEach {
        options.encoding = "UTF-8"
        options.release = 8
    }
    tasks.withType(AbstractArchiveTask).configureEach {
        preserveFileTimestamps = false
        reproducibleFileOrder = true
    }
}

configure(subprojects.findAll { it.name in ["forge", "fabric"] }) {
    tasks.withType(ProcessResources).configureEach {
        from(rootProject.file("../../licenses")) { into "META-INF/licenses/aurora-core" }
    }
}
