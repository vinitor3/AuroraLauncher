plugins { id "com.github.johnrengelman.shadow" }
architectury { platformSetupLoomIde(); forge() }
loom { forge { convertAccessWideners = true } }
configurations { common; shadowCommon; compileClasspath.extendsFrom common; runtimeClasspath.extendsFrom common; developmentForge.extendsFrom common }
dependencies {
    forge "net.minecraftforge:forge:${rootProject.forge_version}"
    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionForge")) { transitive false }
    shadowCommon files(rootProject.file("../../api/build/libs/aurora-core-api-1.0.0.jar"))
    shadowCommon files(rootProject.file("../../runtime/build/libs/aurora-core-runtime-1.0.0.jar"))
    shadowCommon "com.google.code.gson:gson:2.10.1"
    shadowCommon "org.java-websocket:Java-WebSocket:1.5.6"
}
processResources {
    inputs.properties "version": project.version, "minecraft_range": rootProject.forge_minecraft_range, "loader_range": rootProject.forge_loader_range
    filesMatching("META-INF/mods.toml") { expand "version": project.version, "minecraft_range": rootProject.forge_minecraft_range, "loader_range": rootProject.forge_loader_range }
}
shadowJar {
    configurations = [project.configurations.shadowCommon]
    archiveClassifier = "dev-shadow"
    relocate "com.google.gson", "com.aurora.core.shadow.gson"
    relocate "org.java_websocket", "com.aurora.core.shadow.websocket"
    exclude "fabric.mod.json", "META-INF/versions/**", "module-info.class"
    manifest { attributes "MixinConfigs": "aurora_core.mixins.json" }
}
remapJar { input.set shadowJar.archiveFile; dependsOn shadowJar }
