[package]
name = "aurora-connect-lab"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "GPL-3.0-only"
publish = false
description = "Explicitly invoked, direct-only Aurora Connect transport laboratory"

[features]
default = []
local-relay-lab = ["dep:iroh-relay", "dep:windows-registry"]
# Own native86 fixtures only; implementation also requires debug_assertions.
native-voice-test-support = []

[dependencies]
iroh = { version = "=1.3.0", default-features = false, features = ["tls-ring"] }
iroh-relay = { version = "=1.3.0", optional = true, default-features = false, features = ["server", "tls-ring"] }
bytes = "1.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "=0.11.0", default-features = false }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "time", "sync", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }

[target.'cfg(windows)'.dependencies]
windows-registry = { version = "=0.6.1", optional = true }

[lints.rust]
unsafe_code = "forbid"
