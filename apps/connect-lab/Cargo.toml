[package]
name = "aurora-connect-lab"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "GPL-3.0-only"
publish = false
description = "Explicitly invoked, direct-only Aurora Connect transport laboratory"

[dependencies]
iroh = { version = "=1.3.0", default-features = false, features = ["tls-ring"] }
bytes = "1.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "=0.11.0", default-features = false }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "time", "sync", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }

[lints.rust]
unsafe_code = "forbid"
