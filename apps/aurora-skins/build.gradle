plugins { id "base" }

allprojects {
    group = "com.aurora.skins"
    version = "0.2.5"
    repositories { mavenCentral() }
}

subprojects {
    apply plugin: "java-library"
    java { toolchain { languageVersion = JavaLanguageVersion.of(17) }; withSourcesJar() }
    tasks.withType(JavaCompile).configureEach { options.encoding = "UTF-8"; options.release = 8 }
    tasks.withType(Test).configureEach { useJUnitPlatform(); testLogging { events "failed", "skipped" } }
    tasks.withType(AbstractArchiveTask).configureEach { preserveFileTimestamps = false; reproducibleFileOrder = true }
}
