plugins { id "com.github.johnrengelman.shadow" }
architectury { platformSetupLoomIde(); forge() }
loom { forge { convertAccessWideners = true } }

configurations { common; shadowCommon; compileClasspath.extendsFrom common; runtimeClasspath.extendsFrom common; developmentForge.extendsFrom common }

dependencies {
    compileOnly files(rootProject.file("../../core/build/libs/aurora-skins-core-0.3.0.jar"))
    forge "net.minecraftforge:forge:${rootProject.forge_version}"
    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionForge")) { transitive false }
    shadowCommon files(rootProject.file("../../core/build/libs/aurora-skins-core-0.3.0.jar"))
}

processResources {
    inputs.properties "version": project.version
    filesMatching("META-INF/mods.toml") { expand "version": project.version }
}

shadowJar {
    configurations = [project.configurations.shadowCommon]
    archiveClassifier = "dev-shadow"
    exclude "fabric.mod.json", "META-INF/versions/**", "module-info.class"
    manifest { attributes "MixinConfigs": "aurora_skins.mixins.json" }
}

remapJar { input.set shadowJar.archiveFile; dependsOn shadowJar }
