name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop e núcleo Rust
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Dependências do desktop
        run: npm ci --prefix apps/desktop
      - name: Build da interface
        run: npm --prefix apps/desktop run build
      - name: Testes do núcleo
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

  services:
    name: Serviços TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js para Edge
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validar Edge Proxy
        run: |
          npm ci --prefix apps/edge-proxy
          npm --prefix apps/edge-proxy run check
      - name: Node.js para Firebase Functions
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validar Firebase Functions
        run: |
          npm ci --prefix functions
          npm --prefix functions run lint
